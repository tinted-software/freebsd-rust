[package]
name = "fbsd-sys"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Raw bindgen FFI bindings to the FreeBSD kernel headers needed to build a KLD (module.h, kernel.h, linker.h, systm.h, malloc.h)."
links = "fbsd_kernel_headers"

[lib]
name = "fbsd_sys"

[build-dependencies]
bindgen = { version = "0.72", default-features = false, features = ["runtime"] }
